<style>
  :root{--ouro:#d6ba7a;--ouro2:#f1dfa8;--creme:#f3e9d2;--verde:#07332c;--u:0.5px}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#04241f}
  body{color:var(--ouro);font-family:"Cormorant Garamond",Georgia,serif;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
  body.fechado{overflow:hidden;height:100vh}

  /* ---------- capa + vídeo ---------- */
  .tela{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#04241f;z-index:70;transition:opacity .9s ease}
  .tela.oculta{opacity:0;pointer-events:none}
  .quadro{position:relative;height:100%;width:100%;max-width:calc(100vh * 9 / 16);max-height:calc(100vw * 16 / 9);overflow:hidden}
  .quadro>img,.quadro video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .borrado{position:absolute;inset:-60px;background:url(img/capa.jpg) center/cover;filter:blur(28px) brightness(.6)}
  #capa{cursor:pointer}
  .halo-lacre{position:absolute;left:51.2%;top:49.7%;width:30%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,226,150,.35),rgba(255,214,120,0) 62%);pointer-events:none;animation:haloL 3s ease-in-out infinite}
  @keyframes haloL{0%,100%{opacity:.25;transform:translate(-50%,-50%) scale(.92)}50%{opacity:.85;transform:translate(-50%,-50%) scale(1.06)}}
  .toque{position:absolute;left:0;right:0;top:61.5%;text-align:center;font:600 clamp(15px,4.2vw,20px) "Cormorant Garamond",serif;letter-spacing:.34em;padding-left:.34em;text-transform:uppercase;color:var(--ouro2);text-shadow:0 2px 12px rgba(0,0,0,.8);animation:respira 2.4s ease-in-out infinite}
  .toque::after{content:"";display:block;width:34%;height:1px;margin:10px auto 0;background:linear-gradient(90deg,transparent,var(--ouro),transparent)}
  @keyframes respira{0%,100%{opacity:1}50%{opacity:.5}}
  #pular{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));padding:8px 14px;border:1px solid rgba(214,186,122,.6);border-radius:30px;background:rgba(4,36,31,.65);color:var(--ouro2);font:500 15px "Cormorant Garamond",serif;letter-spacing:.08em;opacity:0;transition:opacity .6s}
  #animacao.mostra-pular #pular{opacity:1}
  #flash{position:fixed;inset:0;z-index:80;background:radial-gradient(circle at 50% 50%,#fff8e2,#f1dfa8 55%,#d6ba7a);opacity:0;pointer-events:none;transition:opacity .7s ease}

  /* ---------- página ---------- */
  .pagina{position:relative;width:min(100vw,540px);margin:0 auto;aspect-ratio:1080/7874;background:var(--verde);overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,.6)}
  .fundo{position:absolute;left:0;width:100%;display:block}
  .patch{position:absolute;display:block;height:auto;opacity:0;transition:opacity .7s ease;pointer-events:none}
  .patch.on{opacity:1}
  .el.feito,#brasao.feito{visibility:hidden}
  .el{position:absolute;display:block;height:auto}
  .el img{display:block;width:100%;height:auto}
  img.el{pointer-events:none;user-select:none}

  /* ---------- entradas ---------- */
  .fx-foto{opacity:0;transform:scale(1.06);filter:blur(12px) brightness(.55)}
  .fx-foto.on{animation:foto 1.8s cubic-bezier(.2,.7,.2,1) var(--d) forwards}
  @keyframes foto{to{opacity:1;transform:none;filter:blur(0) brightness(1)}}
  .fx-wipe,.fx-escrita{-webkit-mask-image:linear-gradient(90deg,#000 44%,transparent 56%);mask-image:linear-gradient(90deg,#000 44%,transparent 56%);-webkit-mask-size:260% 100%;mask-size:260% 100%;-webkit-mask-position:100% 0;mask-position:100% 0;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
  .fx-wipe.on{animation:wipe 1.7s cubic-bezier(.45,0,.25,1) var(--d) forwards}
  .fx-escrita.on{animation:wipe 2.3s cubic-bezier(.5,0,.35,1) var(--d) forwards}
  @keyframes wipe{to{-webkit-mask-position:0 0;mask-position:0 0}}
  .faisca{position:absolute;left:0;top:52%;width:calc(var(--u)*26);height:calc(var(--u)*26);margin:calc(var(--u)*-13);border-radius:50%;background:radial-gradient(circle,#fff6d8 0%,rgba(241,223,168,.9) 30%,rgba(241,223,168,0) 70%);opacity:0;pointer-events:none}
  .fx-escrita.on .faisca{animation:faisca 2.3s cubic-bezier(.5,0,.35,1) var(--d) forwards}
  @keyframes faisca{0%{left:0;top:55%;opacity:0}8%{opacity:1}30%{top:35%}55%{top:62%}80%{top:40%;opacity:1}100%{left:100%;top:50%;opacity:0}}
  .fx-blur{opacity:0;filter:blur(10px);transform:translateY(calc(var(--u)*22))}
  .fx-blur.on{animation:blurin 1.3s cubic-bezier(.2,.7,.2,1) var(--d) forwards}
  @keyframes blurin{to{opacity:1;filter:blur(0);transform:none}}
  .fx-spread{opacity:0;transform:scaleX(1.3);filter:blur(7px)}
  .fx-spread.on{animation:spread 1.6s cubic-bezier(.2,.8,.2,1) var(--d) forwards}
  @keyframes spread{to{opacity:1;transform:none;filter:blur(0)}}
  .fx-sobe{opacity:0;transform:translateY(calc(var(--u)*26));filter:blur(6px)}
  .fx-esq{opacity:0;transform:translateX(calc(var(--u)*-70));filter:blur(6px)}
  .fx-dir{opacity:0;transform:translateX(calc(var(--u)*70));filter:blur(6px)}
  .fx-sobe.on,.fx-esq.on,.fx-dir.on{animation:blurin 1.4s cubic-bezier(.2,.7,.2,1) var(--d) forwards}
  .fx-trinta{opacity:0;transform:scale(1.7);filter:blur(14px)}
  .fx-trinta.on{animation:trinta 1.5s cubic-bezier(.2,.8,.2,1) var(--d) forwards,brilho16 2.2s ease-out calc(var(--d) + 1.2s)}
  @keyframes trinta{to{opacity:1;transform:none;filter:blur(0)}}
  @keyframes brilho16{0%,100%{filter:drop-shadow(0 0 0 rgba(214,186,122,0))}40%{filter:drop-shadow(0 0 calc(var(--u)*22) rgba(214,186,122,.8))}}

  /* ---------- brasão CCV (anima no lugar quando o convite abre) ---------- */
  #brasao{position:absolute;z-index:4}
  #brasao svg{display:block;width:100%;height:auto;overflow:visible}
  #brasao .traco{fill:none;stroke:#f1dfa8;stroke-width:.55;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
  #brasao .cheio{opacity:0;filter:drop-shadow(1px 2px 1.5px rgba(0,0,0,.45))}
  #brasao.on .traco{animation:traca 1.5s cubic-bezier(.45,0,.25,1) var(--t) forwards,apaga .8s ease calc(var(--t) + 1.9s) forwards}
  #brasao.on .cheio{animation:enche 1.1s ease 2.1s forwards}
  #brasao.on .letra{animation:enche .9s ease var(--t) forwards}
  @keyframes traca{to{stroke-dashoffset:0}}
  @keyframes apaga{to{opacity:0}}
  @keyframes enche{to{opacity:1}}
  #brilho-bras{transform:translateX(-120px)}
  #brasao.on #brilho-bras{animation:varre 1.3s cubic-bezier(.5,0,.3,1) 3.1s forwards}
  @keyframes varre{to{transform:translateX(320px)}}
  #brasao.on svg{animation:halo 2.6s ease-out 3s}
  @keyframes halo{0%{filter:drop-shadow(0 0 0 rgba(241,223,168,0))}35%{filter:drop-shadow(0 0 14px rgba(241,223,168,.6))}100%{filter:drop-shadow(0 0 0 rgba(241,223,168,0))}}

  /* ---------- contagem: batimento ---------- */
  .contagem{position:absolute;left:0;width:100%;text-align:center}
  .contagem .titulo{text-transform:uppercase;font-weight:600;font-size:calc(var(--u)*58);letter-spacing:.42em;padding-left:.42em;color:var(--ouro);opacity:0;filter:blur(8px)}
  .contagem.on .titulo{animation:blurin 1.3s ease forwards}
  .ecg{display:block;width:100%;height:calc(var(--u)*130);margin-top:calc(var(--u)*30);overflow:visible}
  .ecg .base{fill:none;stroke:url(#linhaOuro);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
  .contagem.on .ecg .base{animation:traca 1.6s cubic-bezier(.6,0,.3,1) .3s forwards}
  .ecg .pulso{fill:none;stroke:#fff3cc;stroke-width:3.6;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:.08 1;stroke-dashoffset:.08;opacity:0;filter:drop-shadow(0 0 5px rgba(255,228,150,.95))}
  .contagem.batendo .ecg .pulso{opacity:1;animation:corre 1s linear infinite}
  @keyframes corre{from{stroke-dashoffset:.08}to{stroke-dashoffset:-1}}
  .relogio{display:flex;justify-content:center;align-items:center;gap:calc(var(--u)*18);margin-top:calc(var(--u)*34)}
  .uni{width:calc(var(--u)*190);opacity:0;transform:translateY(calc(var(--u)*30))}
  .contagem.on .uni{animation:blurin 1.1s cubic-bezier(.2,.7,.2,1) calc(.9s + var(--i)*.15s) forwards}
  .uni b{display:block;font-weight:500;font-size:calc(var(--u)*120);line-height:1;color:var(--ouro);font-variant-numeric:lining-nums tabular-nums;background:linear-gradient(180deg,#f6e7b6,#d6ba7a 55%,#a9803f);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .uni small{display:block;margin-top:calc(var(--u)*12);font-weight:600;font-size:calc(var(--u)*25);letter-spacing:.24em;padding-left:.24em;text-transform:uppercase;color:var(--creme)}
  .sep{width:1px;height:calc(var(--u)*150);background:linear-gradient(transparent,var(--ouro),transparent);transform:scaleY(0)}
  .contagem.on .sep{animation:linhaV 1.2s cubic-bezier(.7,0,.2,1) 1.2s forwards}
  @keyframes linhaV{to{transform:none}}
  .contagem .data{margin-top:calc(var(--u)*46);font-weight:600;font-size:calc(var(--u)*28);letter-spacing:.4em;padding-left:.4em;color:var(--ouro);font-variant-numeric:lining-nums;opacity:0}
  .contagem.on .data{animation:blurin 1.2s ease 1.7s forwards}
  .chegou{display:none;margin-top:calc(var(--u)*40);font-weight:500;font-size:calc(var(--u)*62);letter-spacing:.12em;text-transform:uppercase}

  /* ---------- ícones ---------- */
  .icone{z-index:5;border:0;background:none;padding:0;cursor:pointer;opacity:0;transform:scale(.4) rotate(-25deg);border-radius:50%}
  .icone.on{animation:pop 1s cubic-bezier(.25,1.5,.45,1) var(--d) forwards}
  @keyframes pop{to{opacity:1;transform:none}}
  .icone .reflexo{position:absolute;inset:12%;border-radius:50%;overflow:hidden;pointer-events:none}
  .icone .reflexo::before{content:"";position:absolute;top:-20%;bottom:-20%;width:40%;left:-60%;background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,250,225,.55),rgba(255,255,255,0));transform:skewX(-18deg)}
  .icone.on .reflexo::before{animation:reflexo 4.5s ease-in-out calc(var(--d) + 1.2s) infinite}
  @keyframes reflexo{0%{left:-60%}28%,100%{left:130%}}
  .icone::after{content:"";position:absolute;inset:12%;border-radius:50%;pointer-events:none}
  .icone.on::after{animation:pulso 2.6s ease-in-out calc(var(--d) + 1s) infinite}
  @keyframes pulso{0%,100%{box-shadow:0 0 0 0 rgba(241,223,168,0)}50%{box-shadow:0 0 calc(var(--u)*34) calc(var(--u)*6) rgba(241,223,168,.35)}}
  .icone:focus-visible{outline:2px solid var(--ouro);outline-offset:4px}

  #poeira{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}

  /* ---------- confirmação (Forms dentro do convite) ---------- */
  #rsvp{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(2,20,17,.85);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .4s ease}
  #rsvp.aberto{opacity:1;pointer-events:auto}
  #rsvp .janela{position:relative;width:min(94vw,calc(92vh * 9 / 16));aspect-ratio:9/16;max-height:92vh;background:#fff;border-radius:14px;overflow:hidden;border:1px solid rgba(214,186,122,.6);box-shadow:0 20px 60px rgba(0,0,0,.6)}
  #rsvp iframe{width:100%;height:100%;border:0;display:block}
  #rsvp .fechar{position:absolute;top:8px;right:8px;width:38px;height:38px;border-radius:50%;border:1px solid rgba(214,186,122,.6);background:#07332c;color:var(--ouro2);font:400 22px/1 "Cormorant Garamond",serif;cursor:pointer;z-index:2}
  #rsvp .aviso{display:flex;align-items:center;justify-content:center;height:100%;padding:30px;text-align:center;font:500 21px "Cormorant Garamond",serif;color:#07332c;background:#f6f1e6}

  /* ---------- música ---------- */
  #som{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:65;width:46px;height:46px;border-radius:50%;border:1px solid rgba(214,186,122,.6);background:rgba(4,36,31,.85);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.35)}
  #som.ativo{display:flex}
  #som svg{width:22px;height:22px;fill:none;stroke:var(--ouro);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  #som .off{display:none} #som.mudo .on{display:none} #som.mudo .off{display:block}

  @media (prefers-reduced-motion: reduce){
    .fx-wipe,.fx-escrita{-webkit-mask-position:0 0!important;mask-position:0 0!important}
    [class*="fx-"],.icone,.uni,.contagem .titulo,.contagem .data,#brasao .cheio,#brasao .letra{opacity:1!important;transform:none!important;filter:none!important;animation:none!important}
    #brasao .traco{display:none} .sep{transform:none!important} .ecg .base{stroke-dashoffset:0!important}
    #poeira{display:none}
  }
</style>
</head>

  document.getElementById('abrir-rsvp').addEventListener('click',function(){
    if(!conteudo.firstChild){
      conteudo.innerHTML=FORMS_URL?'<iframe src="'+FORMS_URL+(FORMS_URL.indexOf('?')<0?'?':'&')+'embedded=true" title="Confirmar presença" loading="lazy"></iframe>':'<div class="aviso">A confirmação de presença estará disponível em breve.</div>'; }
    rsvp.classList.add('aberto'); document.body.style.overflow='hidden';
  });
  function fechar(){ rsvp.classList.remove('aberto'); document.body.style.overflow=''; }
  rsvp.querySelector('.fechar').addEventListener('click',fechar);
  rsvp.addEventListener('click',function(e){ if(e.target===rsvp) fechar(); });
  addEventListener('keydown',function(e){ if(e.key==='Escape') fechar(); });
  document.querySelector('a.icone').addEventListener('click',function(){ saiuPorLink=true; });
})();
</script>
</body>
</html>
